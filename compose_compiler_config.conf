// Compose compiler stability configuration.
// Declares types that Compose should treat as stable so composables
// that receive List/Map/Set parameters can skip recomposition when
// the caller rebuilds the collection. Without this, Compose infers
// collection-typed params as unstable under strong skipping and
// re-runs the composable on every parent recomposition.

// Kotlin stdlib collections
kotlin.collections.*
// Java time types (used in history/stats)
java.time.*
// LunarTune data models that are immutable
dev.citali.lunartune.db.entities.*
dev.citali.lunartune.models.*
dev.citali.lunartune.home.*
dev.citali.lunartune.constants.*
