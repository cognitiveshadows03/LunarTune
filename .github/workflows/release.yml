name: Bump to new version
on:
  push:
    branches:
      - 'main'
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
  workflow_dispatch:

jobs:
  check-version:
    if: contains(github.ref, 'refs/tags') == false
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.version_changed }}
      new_version: ${{ steps.check_version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check version and Tag
        id: check_version
        run: |
          if [ ! -f app/build.gradle.kts ]; then
            echo "Error: app/build.gradle.kts does not exist"
            exit 1
          fi

          NEW_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo "")

          if [ -z "$NEW_VERSION" ]; then
            echo "Error: Could not find versionName in app/build.gradle.kts"
            exit 1
          fi

          echo "Detected version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse "v$NEW_VERSION" >/dev/null 2>&1; then
            echo "Tag v$NEW_VERSION already exists. Skipping release."
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tag v$NEW_VERSION does not exist. Proceeding with release."
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Debug output
        run: |
          echo "version_changed: ${{ steps.check_version.outputs.version_changed }}"
          echo "new_version: ${{ steps.check_version.outputs.new_version }}"

  reproducibility:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Use latest IconPack
        run: git submodule update --init --remote IconPack

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify reproducible unsigned universal APK
        id: repro
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
        run: |
          set -euo pipefail

          REPRO_DIR="${RUNNER_TEMP}/repro"
          mkdir -p "$REPRO_DIR"

          locate_universal_apk() {
            local metadata
            local output_file
            local candidate

            metadata="$(find app/build/outputs/apk -type f -name output-metadata.json | head -n 1 || true)"
            if [ -z "${metadata:-}" ]; then
              return 1
            fi

            output_file="$(grep -oP '"outputFile"\s*:\s*"\K[^"]+' "$metadata" | head -n 1 || true)"
            if [ -z "${output_file:-}" ]; then
              return 1
            fi

            candidate="$(dirname "$metadata")/$output_file"
            if [ -f "$candidate" ]; then
              echo "$candidate"
              return 0
            fi

            return 1
          }

          # Clean build of the unsigned universal APK; keeps a copy as universal-<n>.apk
          # and prints its sha256. Sets APK_SHA for the caller.
          build_universal() {
            local n="$1"
            local apk

            ./gradlew clean assembleGmsMobileUniversalRelease
            apk="$(locate_universal_apk || true)"
            if [ -z "${apk:-}" ] || [ ! -f "$apk" ]; then
              echo "Could not find unsigned universal release APK (build #$n)."
              echo "APK outputs:"
              find app/build/outputs/apk -maxdepth 6 -type f -print || true
              exit 1
            fi
            cp "$apk" "$REPRO_DIR/universal-$n.apk"
            APK_SHA="$(sha256sum "$apk" | awk '{print $1}')"
            echo "sha256 #$n: $APK_SHA"
          }

          build_universal 1
          SHA_1="$APK_SHA"

          build_universal 2
          SHA_2="$APK_SHA"

          if [ "$SHA_1" = "$SHA_2" ]; then
            echo "Reproducible: builds #1 and #2 produced byte-identical APKs."
            exit 0
          fi

          # The two builds differ. Show *what* differs so the cause can be tracked down,
          # keep both APKs as an artifact, then give the toolchain one more attempt.
          echo "mismatch=true" >> "$GITHUB_OUTPUT"
          echo "::warning title=Non-reproducible build::Builds #1 and #2 produced different APKs. Listing differing entries and building a third time."

          python3 - "$REPRO_DIR/universal-1.apk" "$REPRO_DIR/universal-2.apk" <<'PY'
          import sys
          import zipfile

          first, second = sys.argv[1], sys.argv[2]
          entries_1 = {i.filename: i for i in zipfile.ZipFile(first).infolist()}
          entries_2 = {i.filename: i for i in zipfile.ZipFile(second).infolist()}

          lines = []
          for name in sorted(set(entries_1) | set(entries_2)):
              a = entries_1.get(name)
              b = entries_2.get(name)
              if a is None:
                  lines.append(f"  only in build #2: {name}")
              elif b is None:
                  lines.append(f"  only in build #1: {name}")
              elif (a.CRC, a.file_size) != (b.CRC, b.file_size):
                  lines.append(
                      f"  differs: {name} "
                      f"(#1 {a.file_size} B crc {a.CRC:08x} / #2 {b.file_size} B crc {b.CRC:08x})"
                  )

          if lines:
              print(f"{len(lines)} APK entries differ between build #1 and build #2:")
              print("\n".join(lines))
          else:
              print("Every APK entry has identical size and CRC; only container metadata "
                    "(entry order, alignment or headers) differs.")
          PY

          build_universal 3
          SHA_3="$APK_SHA"

          if [ "$SHA_3" = "$SHA_1" ] || [ "$SHA_3" = "$SHA_2" ]; then
            echo "::warning title=Intermittent non-determinism::Build #3 matches build #$([ "$SHA_3" = "$SHA_1" ] && echo 1 || echo 2). Treating the build as reproducible; the mismatching APKs are kept in the reproducibility-mismatch artifact."
            exit 0
          fi

          echo "::error title=Non-reproducible build::Three consecutive clean builds produced three different APKs."
          exit 1

      - name: Upload APKs from mismatching builds
        if: always() && steps.repro.outputs.mismatch == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: reproducibility-mismatch
          path: ${{ runner.temp }}/repro/*.apk
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: Build Release APKs
    needs: [check-version, reproducibility]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: arm64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: armeabi
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: x86_64
          - device: mobile
            distribution: gms
            distributionName: Gms
            deviceName: Mobile
            abi: universal
          - device: tv
            distribution: gms
            distributionName: Gms
            deviceName: Tv
            abi: universal
          - device: mobile
            distribution: foss
            distributionName: Foss
            deviceName: Mobile
            abi: universal

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Use latest IconPack
        run: git submodule update --init --remote IconPack

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve variant names
        id: variant
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ matrix.distribution }}"
          DISTRIBUTION_CAP="${{ matrix.distributionName }}"
          DEVICE="${{ matrix.device }}"
          ABI="${{ matrix.abi }}"
          DEVICE_CAP="${{ matrix.deviceName }}"
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          echo "distribution=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "distribution_cap=$DISTRIBUTION_CAP" >> "$GITHUB_OUTPUT"
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "abi=$ABI" >> "$GITHUB_OUTPUT"
          echo "device_cap=$DEVICE_CAP" >> "$GITHUB_OUTPUT"
          echo "abi_cap=$ABI_CAP" >> "$GITHUB_OUTPUT"
          echo "gradle_task=assemble${DISTRIBUTION_CAP}${DEVICE_CAP}${ABI_CAP}Release" >> "$GITHUB_OUTPUT"
          echo "artifact_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-release" >> "$GITHUB_OUTPUT"
          echo "apk_name=app-${DISTRIBUTION}-${DEVICE}-${ABI}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_TASK="${{ steps.variant.outputs.gradle_task }}"
          ABI="${{ matrix.abi }}"

          if [ "$ABI" = "armeabi" ] || [ "$ABI" = "x86" ]; then
            ./gradlew "$GRADLE_TASK" 2>&1 | python3 -c "import re,sys;p=re.compile(r'^(WARNING: )?\[CXX5202\] This app only has 32-bit \[(armeabi-v7a|x86)\] native libraries\. Beginning August 1, 2025, Google Play will require 64-bit versions of apps and app updates that contain native code\.\\s*$', re.M);sys.stdout.write(p.sub('', sys.stdin.read()))"
          else
            ./gradlew "$GRADLE_TASK"
          fi
        env:
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}

      - name: Resolve release output directory
        id: release_dir
        shell: bash
        run: |
          set -euo pipefail
          DISTRIBUTION="${{ steps.variant.outputs.distribution }}"
          DEVICE="${{ steps.variant.outputs.device }}"
          ABI="${{ steps.variant.outputs.abi }}"
          DEVICE_CAP="${{ steps.variant.outputs.device_cap }}"
          ABI_CAP="${{ steps.variant.outputs.abi_cap }}"
          CANDIDATES=(
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DISTRIBUTION}/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/gms${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/gms/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/gms/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE}/${ABI}/release"
            "app/build/outputs/apk/${DEVICE}${ABI_CAP}/release"
            "app/build/outputs/apk/${DEVICE_CAP}${ABI_CAP}/release"
            "app/build/outputs/apk/${ABI}/${DEVICE}/release"
          )
          for d in "${CANDIDATES[@]}"; do
            if [ -d "$d" ]; then
              echo "release_dir=$d" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          FOUND_METADATA="$(
            find app/build/outputs/apk -type f -name "output-metadata.json" \
              \( \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DISTRIBUTION}${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/release/output-metadata.json" -o \
                -path "*/${ABI}/${DEVICE}/release/output-metadata.json" -o \
                -path "*/${DEVICE}/${ABI}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE}${ABI_CAP}/*/release/output-metadata.json" -o \
                -path "*/${DEVICE_CAP}${ABI_CAP}/*/release/output-metadata.json" \
              \) \
              | head -n 1 || true
          )"
          if [ -n "${FOUND_METADATA:-}" ]; then
            echo "release_dir=$(dirname "$FOUND_METADATA")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Could not resolve APK release output directory for DISTRIBUTION=$DISTRIBUTION DEVICE=$DEVICE ABI=$ABI"
          find app/build/outputs/apk -maxdepth 8 -type d -print || true
          exit 1

      - name: Sign APK
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ steps.release_dir.outputs.release_dir }}/
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Move and rename APK
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_DIR="${{ steps.release_dir.outputs.release_dir }}"
          mkdir -p "$RELEASE_DIR/out"
          mapfile -t SIGNED_APKS < <(
            find "$RELEASE_DIR" -maxdepth 1 -type f \
              \( -name "*-signed.apk" -o -name "*-unsigned-signed.apk" \)
          )
          if [ "${#SIGNED_APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one signed APK in $RELEASE_DIR, found ${#SIGNED_APKS[@]}"
            find "$RELEASE_DIR" -maxdepth 2 -type f -print || true
            exit 1
          fi
          APK="${SIGNED_APKS[0]}"
          mv "$APK" "$RELEASE_DIR/out/${{ steps.variant.outputs.apk_name }}"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.variant.outputs.artifact_name }}
          path: ${{ steps.release_dir.outputs.release_dir }}/out/${{ steps.variant.outputs.apk_name }}

  create-release:
    needs: [check-version, build]
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download all APKs
        uses: actions/download-artifact@v8
        with:
          path: downloaded_artifacts/

      - name: Resolve changelog range
        id: changelog_range
        shell: bash
        run: |
          # Empty from_ref means "whole history": covers the first release from a
          # rewritten history, where no v-tag is reachable from main.
          LAST_TAG="$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || true)"
          echo "from_ref=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "to_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Changelog
        id: build_changelog
        shell: bash
        env:
          FROM_REF: ${{ steps.changelog_range.outputs.from_ref }}
          TO_REF: ${{ steps.changelog_range.outputs.to_ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          CATEGORIES = [
              ("## Features", ("feat",)),
              ("## Fixes", ("fix",)),
              ("## Performance", ("perf",)),
              ("## Refactors", ("refactor",)),
              ("## Documentation", ("docs",)),
              ("## Build / CI", ("build", "ci")),
          ]
          PREFIX = re.compile(r"^([a-z]+)(?:\([^)]*\))?(!)?:\s+")

          from_ref = os.environ["FROM_REF"]
          to_ref = os.environ["TO_REF"]
          revision = f"{from_ref}..{to_ref}" if from_ref else to_ref
          # Merge commits excluded: they only restate PR numbers, while the feature
          # commits they carry are listed individually with hashes below.
          out = subprocess.run(
              ["git", "log", "--no-merges", "--pretty=format:%h%x00%s", revision],
              check=True, capture_output=True, text=True,
          ).stdout

          buckets: dict[str, list[str]] = {title: [] for title, _ in CATEGORIES}
          uncategorized: list[str] = []
          for line in out.splitlines():
              sha, _, subject = line.partition("\x00")
              # Skip merge-titled commits even if history rewriting left them
              # without a second parent (--no-merges only filters true merges).
              if not sha or not subject or subject.startswith("Merge "):
                  continue
              entry = f"- {subject} ({sha})"
              match = PREFIX.match(subject)
              label = match.group(1) if match else ""
              for title, prefixes in CATEGORIES:
                  if label in prefixes:
                      buckets[title].append(entry)
                      break
              else:
                  uncategorized.append(entry)

          parts = ["# Changelog", ""]
          for title, _ in CATEGORIES:
              if buckets[title]:
                  parts += [title, ""] + buckets[title] + [""]
          if uncategorized:
              parts += ["<details>", "<summary>Other changes</summary>", ""] + uncategorized + ["", "</details>", ""]

          highlights = Path(".github/release-highlights.md")
          if highlights.is_file():
              parts = ["## Highlights", "", highlights.read_text(encoding="utf-8").strip(), ""] + parts

          Path("generated_changelog.md").write_text("\n".join(parts).rstrip() + "\n", encoding="utf-8")
          total = sum(len(v) for v in buckets.values()) + len(uncategorized)
          print(f"changelog entries: {total}")
          PY

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          RELEASE_VERSION: ${{ needs.check-version.outputs.new_version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          MOBILE_UNIVERSAL_APK=$(find downloaded_artifacts/app-gms-mobile-universal-release -name "*.apk" | head -n 1)
          mapfile -t OTHER_APKS < <(find downloaded_artifacts -path "*/app-*-release/*.apk" ! -path "*/app-gms-mobile-universal-release/*" | sort)

          python3 - <<'PY'
          from pathlib import Path

          limit = 120_000
          notes = Path("generated_changelog.md").read_text(encoding="utf-8")
          if len(notes) > limit:
              notes = notes[:limit].rstrip() + "\n\n…truncated. Full history is in git.\n"
          Path("release_notes.md").write_text(notes, encoding="utf-8")
          PY

          gh release create "v${RELEASE_VERSION}" \
            --target "${RELEASE_SHA}" \
            --title "${RELEASE_VERSION}" \
            --notes-file release_notes.md \
            "$MOBILE_UNIVERSAL_APK" \
            "${OTHER_APKS[@]}"
